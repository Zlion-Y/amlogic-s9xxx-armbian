name: Package and verify final W152D USB image

on:
  push:
    branches: [w152d-6.12-final-audit]
  workflow_dispatch:

env:
  TZ: Etc/UTC

jobs:
  setup:
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on set_release input
        id: set-matrix
        run: |
          if [[ "bookworm" == "all" ]]; then
            MATRIX='{"include":[{"release":"trixie"},{"release":"bookworm"},{"release":"resolute"},{"release":"noble"}]}'
          else
            MATRIX='{"include":[{"release":"bookworm"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    needs: setup
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    name: build-armbian-${{ matrix.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          #sudo apt-get -y full-upgrade
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download Armbian from Releases
        id: down
        working-directory: /builder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          armbian_buildpath="build/output/images"
          [[ -d "${armbian_buildpath}" ]] || mkdir -p "${armbian_buildpath}"
          ln -sf /builder/build ${{ github.workspace }}/build
          set -euo pipefail
          base="${armbian_buildpath}/Armbian_26.11.0-trunk_bookworm_arm64_6.18.64.img.gz"
          curl -fsSL --retry 3 --max-time 300 \
              'https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_bookworm_arm64_server_2026.11/Armbian_26.11.0-trunk_bookworm_arm64_6.18.64.img.gz' -o "$base"
          printf '%s  %s\n' 'f28cfcd7cef82f2eb4b650adbd4b1126cef7f07a692e03d50005cba8b740ff32' "$base" | sha256sum -c -
          echo "build_tag=W152D-final-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Fetch synced firmware and U-Boot from the forks
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch main https://github.com/Zlion-Y/firmware.git /builder/firmware-deps
          git clone -q --depth=1 --branch main https://github.com/Zlion-Y/u-boot.git /builder/uboot-deps
          test "$(git -C /builder/firmware-deps rev-parse HEAD)" = 'b8be181e44467a6a82ac34c611205df1420154d2'
          test "$(git -C /builder/uboot-deps rev-parse HEAD)" = 'ceae81edc1ffc4d7e05f848a2408371389948538'
          firmware=build-armbian/armbian-files/common-files/usr/lib/firmware
          mkdir -p "$firmware" build-armbian/u-boot
          cp -af --update=none --no-preserve=ownership /builder/firmware-deps/firmware/. "$firmware/"
          cp -af --update=none --no-preserve=ownership /builder/uboot-deps/u-boot/. build-armbian/u-boot/

      - name: Wait for the final kernel package
        timeout-minutes: 135
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          until run=$(gh api 'repos/Zlion-Y/kernel/actions/workflows/compile-mainline-stable-kernel.yml/runs?branch=w152d-6.12-final-audit&per_page=10' \
              --jq '[.workflow_runs[] | select(.head_sha == "2843e8049d9db841fc6ab15464b578fdf98a381b")][0].id // empty') && [[ -n "$run" ]]; do
            sleep 30
          done
          status=$(gh api "repos/Zlion-Y/kernel/actions/runs/$run" --jq '.status + ":" + (.conclusion // "")')
          while [[ "$status" != completed:* ]]; do
            sleep 60
            status=$(gh api "repos/Zlion-Y/kernel/actions/runs/$run" --jq '.status + ":" + (.conclusion // "")')
          done
          test "$status" = completed:success
          release='repos/Zlion-Y/kernel/releases/tags/kernel_w152d-final-89175fd'
          sha=$(gh api "$release" --jq '.assets[] | select(.name == "6.12.118.tar.gz") | .digest')
          [[ "$sha" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh release download 'kernel_w152d-final-89175fd' --repo Zlion-Y/kernel --pattern '6.12.118.tar.gz' --dir /builder
          printf '%s  %s\n' "${sha#sha256:}" /builder/6.12.118.tar.gz | sha256sum -c -
          dest='build-armbian/kernel/w152d-final-89175fd/6.12.118'
          mkdir -p "$dest"
          tar -xf /builder/6.12.118.tar.gz --strip-components=1 -C "$dest"
          (cd "$dest" && sha256sum -c sha256sums)

      - name: Rebuild Armbian [ ${{ matrix.release }} ]
        uses: ./
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: w152d
          armbian_kernel: 6.12.118
          auto_kernel: false
          kernel_repo: Zlion-Y/kernel
          kernel_usage: w152d-final-89175fd
          armbian_fstype: ext4
          builder_name: ophub

      - name: Verify W152D image and both firmware sets
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=("$PACKAGED_OUTPUTPATH"/*_w152d_*.img.gz)
          test "${#images[@]}" -eq 1
          sudo env TMPDIR=/builder unshare --mount --propagation private \
              bash .github/scripts/verify-final-w152d-image.sh "${images[0]}" "$GITHUB_WORKSPACE"
          mkdir -p /builder/final-release
          cp -- "${images[0]}" /builder/final-release/
          (cd /builder/final-release && sha256sum -- *.img.gz > SHA256SUMS)

      - name: Upload Armbian images to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: /builder/final-release/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          prerelease: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### Armbian Image Information
            - Default username: `root`
            - Default password: `1234`
            - W152D USB audit image. Physical boot verification is separate.
            - Update command: `armbian-update`
            ### Applicable Platform
            - 🐧 `arm64`
            - 🐋 Docker image: https://hub.docker.com/u/ophub
