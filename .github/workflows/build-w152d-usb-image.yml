name: Build W152D USB image using release files

on:
  push:
    branches: [w152d-usb-image-rc2]
  workflow_dispatch:

env:
  TZ: Etc/UTC

jobs:
  setup:
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on set_release input
        id: set-matrix
        run: |
          if [[ "bookworm" == "all" ]]; then
            MATRIX='{"include":[{"release":"trixie"},{"release":"bookworm"},{"release":"resolute"},{"release":"noble"}]}'
          else
            MATRIX='{"include":[{"release":"bookworm"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    needs: setup
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    name: build-armbian-${{ matrix.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          #sudo apt-get -y full-upgrade
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download Armbian from Releases
        id: down
        working-directory: /builder
        env:
          BASE_URL: https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_bookworm_arm64_server_2026.11/Armbian_26.11.0-trunk_bookworm_arm64_6.18.64.img.gz
          BASE_NAME: Armbian_26.11.0-trunk_bookworm_arm64_6.18.64.img.gz
          BASE_SHA: f28cfcd7cef82f2eb4b650adbd4b1126cef7f07a692e03d50005cba8b740ff32
          KERNEL_URL: https://github.com/Zlion-Y/kernel/releases/download/kernel_w152d/6.12.118.tar.gz
          KERNEL_SHA: 690716d31c6671b613626cb0316a7ee1f7091142ec18ba087e3200505608c51b
          FIRMWARE_HEAD: 5246acc399cf4bbca9e5ab3e4cb6a9fedf01746a
          UBOOT_HEAD: ceae81edc1ffc4d7e05f848a2408371389948538
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "$BASE_URL" -o "$BASE_NAME"
          printf '%s  %s\n' "$BASE_SHA" "$BASE_NAME" | sha256sum -c -
          curl -fLsS --retry 3 "$KERNEL_URL" -o 6.12.118.tar.gz
          printf '%s  %s\n' "$KERNEL_SHA" 6.12.118.tar.gz | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/build-armbian/kernel/w152d"
          tar -xf 6.12.118.tar.gz -C "$GITHUB_WORKSPACE/build-armbian/kernel/w152d"
          dependency_head() {
            git ls-remote "https://github.com/Zlion-Y/$1.git" refs/heads/main | cut -f1
          }
          test "$(dependency_head firmware)" = "$FIRMWARE_HEAD"
          test "$(dependency_head u-boot)" = "$UBOOT_HEAD"
          mkdir -p /builder/build
          ln -s /builder/build "$GITHUB_WORKSPACE/build"
          printf 'ARMBIAN_INPUT=/builder/%s\n' "$BASE_NAME" >> "$GITHUB_ENV"
      - name: Rebuild Armbian for W152D
        uses: ./
        with:
          build_target: armbian
          armbian_path: ${{ env.ARMBIAN_INPUT }}
          armbian_board: w152d
          armbian_kernel: 6.12.118
          auto_kernel: "false"
          kernel_repo: Zlion-Y/kernel
          kernel_usage: w152d
          armbian_fstype: ext4
          builder_name: Zlion-Y
      - name: Verify the complete USB image
        env:
          TMPDIR: /builder
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=("$PACKAGED_OUTPUTPATH"/*_w152d_bookworm_6.12.118_*.img.gz)
          test "${#images[@]}" -eq 1
          sudo env TMPDIR=/builder unshare --mount --propagation private bash .github/scripts/verify-w152d-image.sh "${images[0]}"
          mkdir -p /builder/w152d-release
          cp -- "${images[0]}" documents/w152d-usb-boot.md /builder/w152d-release/
          (cd /builder/w152d-release && sha256sum -- *.img.gz > SHA256SUMS)
      - name: Upload Armbian images to Release
        uses: Zlion-Y/upload-to-releases@af7efd63a4b5e5edd715b304ebdbe0572fa06619
        with:
          tag: W152D-Bookworm-6.12.118-rc2
          name: W152D Armbian Bookworm USB image
          artifacts: /builder/w152d-release/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          prerelease: true
          upload_timeout: "20"
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            W152D USB-boot build using the Bookworm server base and the W152D Linux 6.12.118 kernel packages.
            Verify SHA256SUMS, extract the .img.gz file, then write the image to a USB drive using Etcher.
            System username: root. Initial password: 1234. Follow the first-login prompts.
            See w152d-usb-boot.md for the one-time vendor U-Boot setup.
            The image passed automated filesystem and boot file checks. This exact image is pending a physical boot test.
